type Query {
  previewProjectImport(key: String!): ProjectImportPreview!
  getWorkspace: Workspace!
  getPublication: PublicationState!
  previewImport(data: JsonArrayImportInput!, kind: ImportKind!): ImportPreview!
  getInvitations: [ProjectInvitation!]!
  getInvitation(token: String!): InvitationPreview!
  getContentRevisions(before: Int, limit: Int = 30): [ContentRevision!]!
  getContentRevision(id: Int!): ContentRevisionDetail!
  getDeletionImpact(target: DeletionTarget!): DeletionImpact!
  getApiKeys: [ApiKey!]!
  getNodes: [Node!]!
  getValues(data: GetValues!): [Value!]!
  getListPage(request: ListRequest!): ListPage!
  getListItems(request: ListRequest!): [ListItem!]!
  getListColumns(node_id: Int!): [Node!]!
  getNodeSettings: [NodeSettings!]!
  getProject: ProjectData!
  getUsers: [ProjectUser!]!
}

type ApiKey {
  preview: Boolean!
  name: String!
  key: String!
  is_active: Boolean!
  created_at: DateTimeISO!
  expires_at: DateTimeISO
  last_used: DateTimeISO
}

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.This scalar is serialized to a string in ISO 8601 format and parsed from a string in ISO 8601 format.
"""
scalar DateTimeISO

type Node {
  revision: Int!
  id: Int!
  name: String!
  order: Int!
  type: NodeType!
  parent_id: Int
  depth: Int!
}

enum NodeType {
  root
  object
  string
  article
  number
  boolean
  list
  choice
  date
  color
  media
}

type Value {
  revision: Int!
  id: Int!
  node_id: Int!
  order: Int!
  list_path: [Int!]
  value: JSONObject
  updated_at: DateTime!
}

"""
The `JSONObject` scalar type represents JSON objects as specified by [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf).
"""
scalar JSONObject @specifiedBy(url: "http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf")

"""
A date-time string at UTC, such as 2007-12-03T10:15:30Z, compliant with the `date-time` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar DateTime

input GetValues {
  ids: [Int!]!
}

type ListItem {
  revision: Int!
  id: Int!
  node_id: Int!
  order: Int!
  list_path: [Int!]
  value: JSONObject
  updated_at: DateTime!
  children: [Value!]!
}

input ListRequest {
  node_id: Int!
  list_path: [Int!]
  search: String
  filters: [ListFilter!]
  sort_node_id: Int
  direction: String
  limit: Int = 25
  offset: Int = 0
}
input ListFilter { node_id: Int! operator: String! value: String }
type ListPage { items: [ListItem!]! total: Int! limit: Int! offset: Int! }


type NodeSettings {
  revision: Int!
  id: Int!
  node_id: Int!
  settings: JSONObject!
}

type ProjectData {
  project: Project!
  nodes: [Node!]!
  values: [Value!]!
  nodeSettings: [NodeSettings!]!
}

type Project {
  version: Int!
  id: Int!
  name: String!
}

type ProjectUser {
  role: Role!
  id: String!
  name: String!
  email: String!
  confirmed: Boolean!
  owner: Boolean!
  roles: [String!]!
}

type Mutation {
  exportProject: ProjectExport!
  importProjectArchive(key: String!, expectedSource: String!, name: String!): Int!
  publishContent(expectedVersion: Int!, expectedPublication: Int!, revisionId: Int): Publication!
  createProject(name: String!): Int!
  switchProject(id: Int!): Boolean!
  renameProject(name: String!, expectedVersion: Int!): Int!
  deleteProject(expectedVersion: Int!, confirmation: String!): Boolean!
  transferProjectOwnership(userId: String!): Boolean!
  updateUserRole(id: String!, role: Role!, expectedRole: Role!): Boolean!
  revokeInvitation(id: Int!): Boolean!
  acceptInvitation(token: String!): Int!
  restoreContentRevision(id: Int!, expectedVersion: Int!): Int!
  createApiKey(data: CreateApiKey!): ApiKey!
  deleteApiKey(key: String!): Boolean!
  toggleApiKey(key: String!): Boolean!
  insertNode(settings: JSONObject, data: InsertNode!): Node!
  updateNode(data: ChangeNodeInput!): Node!
  deleteNodeById(order: Int!, parent_id: Int!, id: Int!, expectedImpact: String!): Boolean!
  insertListItem(listItem: InsertListItem!): Int!
  deleteListItem(id: Int!, expectedImpact: String!): Boolean!
  upsertValue(data: UpsertValue!): Value!
  truncate(data: TruncateValue!): Boolean!
  deleteValue(id: Int!, expectedImpact: String!): Boolean!
  upsertNodeSettings(data: UpsertNodeSettings!): NodeSettings!
  deleteUser(id: String!): Boolean!
  inviteUser(data: Invite!): CreatedInvitation!
  importArray(data: JsonArrayImportInput!, expectedVersion: Int!, expectedSource: String!): Boolean!
  importObject(data: JsonArrayImportInput!, expectedVersion: Int!, expectedSource: String!): Boolean!
  uploadUrl(data: UploadInput!): Upload!
  finalizeUpload(key: String!): MediaMetadata!
}

input CreateApiKey {
  preview: Boolean! = false
  name: String!
  expires_at: DateTimeISO
}

input InsertNode {
  name: String!
  order: Int!
  type: NodeType!
  parent_id: Int
}

input ChangeNodeInput {
  expectedRevision: Int!
  id: Int!
  name: String!
  order: Int
  type: NodeType
  parent_id: Int
}

input InsertListItem {
  name: String!
  node_id: Int!
  list_path: [Int!]
}

input UpsertValue {
  expectedRevision: Int!
  id: Int
  node_id: Int!
  list_path: [Int!]
  value: JSONObject!
}

input TruncateValue {
  expectedImpact: String!
  node_id: Int!
}

input UpsertNodeSettings {
  expectedRevision: Int!
  id: Int
  node_id: Int!
  settings: JSONObject!
}

input Invite {
  role: Role! = Viewer
  email: String!
}

input JsonArrayImportInput {
  node_id: Int!
  data: String!
  external_id: String
  structure: Boolean!
  list_path: [Int!]
}

type Upload {
  signedUrl: String!
  object: String!
}

type Subscription {
  workspaceUpdated: Boolean!
  apiKeysUpdated: Boolean!
  nodesUpdated: Boolean!
  valuesUpdated: Value
  nodeSettingsUpdated: Boolean!
  usersUpdated: Boolean!
}

enum DeletionKind { NODE NODE_VALUES VALUE }
input DeletionTarget { kind: DeletionKind! id: Int! }
type DeletionImpact {
 fingerprint: String!
 name: String!
 fields: Int!
 values: Int!
 listItems: Int!
 mediaFiles: Int!
 fieldNames: [String!]!
}


type ContentRevision {
 id: Int!
 version: Int!
 created_at: DateTimeISO!
 author_name: String!
 summary: String!
}
type ContentRevisionDetail {
 revision: ContentRevision!
 snapshot: JSONObject!
}

enum Role { Owner Admin Editor Viewer }
type ProjectMembership { id: Int! name: String! version: Int! role: Role! }
type Workspace { projects: [ProjectMembership!]! currentProject: ProjectMembership }
type ProjectInvitation {
 id: Int!
 email: String!
 role: Role!
 created_at: DateTimeISO!
 expires_at: DateTimeISO!
 accepted_at: DateTimeISO
 revoked_at: DateTimeISO
}
type CreatedInvitation { invitation: ProjectInvitation! url: String! emailSent: Boolean! emailError: String }
type InvitationPreview { project_name: String! email: String! role: Role! expires_at: DateTimeISO! accepted: Boolean! }
type Publication { id: Int! revision_id: Int! version: Int! author_name: String! created_at: DateTimeISO! summary: String! }
type PublicationState { draftVersion: Int! current: Publication history: [Publication!]! }
enum ImportKind { ARRAY OBJECT }
type ImportPreview { version: Int! source: String! name: String! fieldsAdded: Int! valuesAdded: Int! valuesChanged: Int! valuesRemoved: Int! }

# Portable content archive. User accounts, keys and revision history are excluded.
type ProjectExport { filename: String! bytes: Int! url: String! }
type ProjectImportPreview { source: String! name: String! fields: Int! values: Int! mediaFiles: Int! mediaBytes: Int! }

input UploadInput { filename: String! contentType: String! size: Int! purpose: String! }
type MediaMetadata { file: String! name: String! contentType: String! size: Int! width: Int height: Int }
