services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: groblin
      POSTGRES_USER: groblin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - groblin-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
volumes:
  groblin-db:
