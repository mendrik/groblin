query GetProject {
	getProject {
		project {
 version
			id
			name
		}
		nodes {
			...Node
		}
		values {
			...Value
		}
		nodeSettings {
			...NodeSettings
		}
	}
}

fragment Value on Value {
 revision
	id
	node_id
	order
	value
	list_path
	updated_at
}

fragment Node on Node {
 revision
	id
	name
	order
	type
	depth
	parent_id
}

fragment NodeSettings on NodeSettings {
 revision
	id
	node_id
	settings
}

subscription NodesUpdated {
	nodesUpdated
}

query GetNodes {
	getNodes {
		...Node
	}
}

mutation InsertNode($data: InsertNode!, $settings: JSONObject) {
	insertNode(data: $data, settings: $settings) {
		id
	}
}

mutation UpdateNode($data: ChangeNodeInput!) {
	updateNode(data: $data) { ...Node }
}

mutation DeleteNodeById($order: Int!, $parent_id: Int!, $id: Int!, $expectedImpact: String!) {
	deleteNodeById(order: $order, parent_id: $parent_id, id: $id, expectedImpact: $expectedImpact)
}

query GetNodeSttings {
	getNodeSettings {
 revision
		id
		settings
		node_id
	}
}

mutation UpsertNodeSettings($data: UpsertNodeSettings!) {
	upsertNodeSettings(data: $data) { ...NodeSettings }
}

subscription NodeSettingsUpdated {
	nodeSettingsUpdated
}

subscription ValuesUpdated {
	valuesUpdated {
		...Value
	}
}

query GetValues($data: GetValues!) {
	getValues(data: $data) {
		...Value
	}
}

mutation InsertListItem($listItem: InsertListItem!) {
	insertListItem(listItem: $listItem)
}

mutation DeleteListItem($id: Int!, $expectedImpact: String!) {
	deleteListItem(id: $id, expectedImpact: $expectedImpact)
}

mutation UpsertValue($data: UpsertValue!) {
	upsertValue(data: $data) { ...Value }
}

mutation DeleteValue($id: Int!, $expectedImpact: String!) {
	deleteValue(id: $id, expectedImpact: $expectedImpact)
}

mutation ImportArray($data: JsonArrayImportInput!, $expectedVersion: Int!, $expectedSource: String!) {
	importArray(data: $data, expectedVersion: $expectedVersion, expectedSource: $expectedSource)
}
mutation ImportObject($data: JsonArrayImportInput!, $expectedVersion: Int!, $expectedSource: String!) { importObject(data: $data, expectedVersion: $expectedVersion, expectedSource: $expectedSource) }
query PreviewImport($data: JsonArrayImportInput!, $kind: ImportKind!) { previewImport(data: $data, kind: $kind) { version source name fieldsAdded valuesAdded valuesChanged valuesRemoved } }

mutation TruncateList($data: TruncateValue!) {
	truncate(data: $data)
}

mutation UploadUrl($data: UploadInput!) {
	uploadUrl(data: $data) {
		signedUrl
		object
	}
}

query GetListItems($request: ListRequest!) {
	getListItems(request: $request) {
 revision
		id
		node_id
		value
		order
		list_path
		updated_at
		children {
			...Value
		}
	}
}

query GetListColumns($node_id: Int!) {
	getListColumns(node_id: $node_id) {
		...Node
	}
}

fragment ApiKey on ApiKey {
 preview
	name
	key
	is_active
	created_at
	expires_at
	last_used
}

query GetApiKeys {
	getApiKeys {
		...ApiKey
	}
}

mutation CreateApiKey($data: CreateApiKey!) {
	createApiKey(data: $data) {
		...ApiKey
	}
}

mutation DeleteApiKey($key: String!) {
	deleteApiKey(key: $key)
}

mutation ToggleApiKey($key: String!) {
	toggleApiKey(key: $key)
}

subscription ApiKeysUpdated {
	apiKeysUpdated
}

fragment ProjectUser on ProjectUser {
 role
	id
	email
	name
	confirmed
	roles
	owner
}

query GetUsers {
	getUsers {
		...ProjectUser
	}
}

mutation InviteUser($invite: Invite!) {
	inviteUser(data: $invite) { invitation { ...ProjectInvitation } url emailSent emailError }
}

mutation DeleteUser($id: String!) {
	deleteUser(id: $id)
}

subscription UsersUpdated {
	usersUpdated
}

query GetDeletionImpact($target: DeletionTarget!) {
 getDeletionImpact(target: $target) { fingerprint name fields values listItems mediaFiles fieldNames }
}

query GetContentRevisions($before: Int, $limit: Int) {
 getContentRevisions(before: $before, limit: $limit) { id version created_at author_name summary }
}
query GetContentRevision($id: Int!) {
 getContentRevision(id: $id) { revision { id version created_at author_name summary } snapshot }
}
mutation RestoreContentRevision($id: Int!, $expectedVersion: Int!) {
 restoreContentRevision(id: $id, expectedVersion: $expectedVersion)
}

fragment ProjectInvitation on ProjectInvitation { id email role created_at expires_at accepted_at revoked_at }
query GetWorkspace { getWorkspace { projects { id name version role } currentProject { id name version role } } }
fragment Publication on Publication { id revision_id version author_name created_at summary }
query GetPublication { getPublication { draftVersion current { ...Publication } history { ...Publication } } }
mutation PublishContent($expectedVersion: Int!, $expectedPublication: Int!, $revisionId: Int) { publishContent(expectedVersion: $expectedVersion, expectedPublication: $expectedPublication, revisionId: $revisionId) { ...Publication } }
subscription WorkspaceUpdated { workspaceUpdated }
query GetInvitations { getInvitations { ...ProjectInvitation } }
query GetInvitation($token: String!) { getInvitation(token: $token) { project_name email role expires_at accepted } }
mutation CreateProject($name: String!) { createProject(name: $name) }
mutation SwitchProject($id: Int!) { switchProject(id: $id) }
mutation RenameProject($name: String!, $expectedVersion: Int!) { renameProject(name: $name, expectedVersion: $expectedVersion) }
mutation DeleteProject($expectedVersion: Int!, $confirmation: String!) { deleteProject(expectedVersion: $expectedVersion, confirmation: $confirmation) }
mutation TransferProjectOwnership($userId: String!) { transferProjectOwnership(userId: $userId) }
mutation UpdateUserRole($id: String!, $role: Role!, $expectedRole: Role!) { updateUserRole(id: $id, role: $role, expectedRole: $expectedRole) }
mutation RevokeInvitation($id: Int!) { revokeInvitation(id: $id) }
mutation AcceptInvitation($token: String!) { acceptInvitation(token: $token) }

mutation ExportProject { exportProject { filename bytes url } }
query PreviewProjectImport($key: String!) { previewProjectImport(key: $key) { source name fields values mediaFiles mediaBytes } }
mutation ImportProjectArchive($key: String!, $expectedSource: String!, $name: String!) { importProjectArchive(key: $key, expectedSource: $expectedSource, name: $name) }

query GetListPage($request: ListRequest!) { getListPage(request: $request) { total limit offset items { revision id node_id order value list_path updated_at children { ...Value } } } }

mutation FinalizeUpload($key: String!) { finalizeUpload(key: $key) { file name contentType size width height } }
