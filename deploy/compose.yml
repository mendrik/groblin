name: groblin
x-app: &app
  image: groblin-backend:${GROBLIN_VERSION:-0.1.0}
  build:
    context: ..
    dockerfile: deploy/backend.Dockerfile
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://groblin:${POSTGRES_PASSWORD:?Generate deploy/.env}@db:5432/groblin
    BETTER_AUTH_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
    TRUSTED_ORIGINS: ${PUBLIC_URL}
    S3_ENDPOINT: http://storage:8333
    S3_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_URL:?Set STORAGE_PUBLIC_URL}
    S3_FORCE_PATH_STYLE: 'true'
    VITE_MEDIA_URL: ${PUBLIC_URL}/media
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: groblin
      POSTGRES_USER: groblin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U groblin -d groblin']
      interval: 5s
      timeout: 3s
      retries: 30
  storage:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ['mini', '-dir=/data']
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${AWS_BUCKET}
    volumes: [media:/data]
    restart: unless-stopped
  storage-setup:
    <<: *app
    command: ['../node_modules/.bin/tsx', 'scripts/setup-storage.ts']
    depends_on:
      storage: {condition: service_started}
  migrate:
    <<: *app
    command: ['../node_modules/.bin/tsx', 'scripts/migrate.ts']
    depends_on:
      db: {condition: service_healthy}
  backend:
    <<: *app
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-setup: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 20s
      retries: 3
      start_period: 20s
  proxy:
    image: groblin-web:${GROBLIN_VERSION:-0.1.0}
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    environment:
      SITE_ADDRESS: ${PUBLIC_URL}
      STORAGE_ADDRESS: ${STORAGE_PUBLIC_URL}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '127.0.0.1:${LOCAL_APP_PORT:-8088}:8088'
      - '127.0.0.1:${LOCAL_STORAGE_PORT:-9008}:9008'
    volumes: [caddy-data:/data, caddy-config:/config]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    profiles: [local]
    ports: ['127.0.0.1:${MAILPIT_PORT:-8028}:8025']
    restart: unless-stopped
volumes:
  database:
  media:
  caddy-data:
  caddy-config:
